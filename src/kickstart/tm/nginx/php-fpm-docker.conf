server {
    index       index.php index.html;
    server_name phpfpm.local;
    error_log   /var/log/nginx/error.log;
    access_log  /var/log/nginx/access.log;
    root /var/www/html;
##
# intent, setup an apache multi-views like handling of URIs to match .php when present:
# anything ending in .php or containing .php followed by path delim 
#   -> php-fpm file $1 request $uri
#   something like: ^((.)*\.php)(\((.)*))?
# anything ending in \ -> $uri\index.php if it exists
# anyhing ending in a path segment with no file extension -> $uri.php if it exists
#   something like: ...

    location / {
        root   /var/www/html;
        index  index.html index.htm;
        try_files $uri @deepmulti @multi;
    }

    location @deepmulti {
        rewrite ^((\/[^\/.]+)(\/[^\/.]+)*)(\/)?$ $1.php last;
    }

    location @multi { #shallow pipe matches
        rewrite ^/$ /index.php last;
        rewrite ^((\/[^\/.]+)(\/[^\/.]+)*)(\/)?$ $2.php last;
    }

    error_page 404              /404.html;
    error_page 500 502 503 504  /50x.html;
    location ~ (/50x\.html|/404\.html)$ {
        root   /var/www/error/;
    }

    location ~ \.php$ {
        #try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass   rooms:9000;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param  PATH_INFO $fastcgi_path_info; #not sure if this is needed
        include fastcgi_params;
    }
}